# Cloudflare Worker config for the StockAdvisor cron scheduler.
# NOTE: no secrets live here. CRON_SECRET and GITHUB_TOKEN are set separately with
#       `wrangler secret put` and stored encrypted by Cloudflare.

name = "stock-advisor-cron"
main = "worker.js"
compatibility_date = "2025-01-01"

# One trigger that ticks every 5 minutes across the NSE market window on weekdays
# (03:00–10:59 UTC = 08:30–16:29 IST). The worker's SCHEDULE table decides what actually
# fires at each exact minute, so this stays well under any cron-count limits.
#
# NAMED days, never numbers: Cloudflare numbers weekdays 1=SUNDAY…7=Saturday (unlike
# standard cron where 1=Monday), so the old "1-5" actually meant Sun–Thu — which is how
# the entire trading day of Fri 2026-07-10 ran ZERO jobs (first Friday of this worker's
# life). "mon-fri" is unambiguous under every interpretation.
# Hours 2-10 UTC: window starts 02:15 UTC (07:45 IST) for the pre-market research pipeline.
[triggers]
crons = ["*/5 2-10 * * mon-fri"]

# Non-secret configuration.
[vars]
VERCEL_BASE = "https://stock-advisor-ai-omega.vercel.app"
GITHUB_REPO = "pranaykushnaji/stock-advisor-ai"
GITHUB_WORKFLOW = "nse-snapshot.yml"

# Run-log store for the Tracker tab (every trigger + its outcome). No repo churn.
[[kv_namespaces]]
binding = "CRON_LOG"
id = "ce0b67b2b758422689f0a47d59a4afe0"
