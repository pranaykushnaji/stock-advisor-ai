name: Hourly Sell Check

# NSE trades 09:15-15:30 IST = 03:45-10:00 UTC.
# Run hourly across that window on weekdays. GitHub Actions cron can drift a few
# minutes under load, but for hourly exit checks that's fine.
on:
  # The hourly sell-check is now driven by the Cloudflare Worker (see cron-worker/), which
  # calls the Vercel /api/sell-check endpoint directly at :10 past each market hour. GitHub's
  # cron was late/dropped, so it has been removed. This workflow is kept as a manual fallback.
  workflow_dispatch:

jobs:
  sell-check:
    runs-on: ubuntu-latest
    steps:
      - name: Hit sell-check endpoint
        run: |
          echo "Triggering sell-check at $(date -u) UTC"
          HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://stock-advisor-ai-omega.vercel.app/api/sell-check")
          echo "HTTP $HTTP"
          echo "Response:"; cat /tmp/resp.json; echo ""
          # A 401/403 means the CRON_SECRET is missing/expired — the endpoint did NOTHING.
          # Fail loudly instead of showing a green check that hides a broken secret.
          if [ "$HTTP" = "401" ] || [ "$HTTP" = "403" ]; then
            echo "AUTH ERROR ($HTTP): CRON_SECRET is missing or expired — sell-check did not run."
            exit 1
          fi
          if [ "$HTTP" -ge 500 ]; then
            echo "Server error"; exit 1
          fi
