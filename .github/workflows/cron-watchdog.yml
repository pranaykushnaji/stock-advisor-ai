name: Cron Watchdog

# Independent backup for the Cloudflare scheduler. GitHub may queue this late;
# after the session it audits failures but never runs a late paper trade.
on:
  schedule:
    - cron: '22,52 2-10 * * 1-5' # 07:52–16:22 IST, every 30 minutes
  workflow_dispatch:
    inputs:
      health_only:
        description: 'Only check the production paper ledger, registry and quote access (no writes)'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write # permits the existing NSE snapshot dispatch fallback

concurrency:
  group: cron-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check paper scans and recover only inside the live window
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GH_TOKEN: ${{ github.token }}
          HEALTH_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.health_only }}
        run: node scripts/cron-watchdog.js
