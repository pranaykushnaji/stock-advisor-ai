name: NSE Data Snapshot

# Fetches real NSE data (movers, bulk/block deals, delivery) from a GitHub runner,
# which may reach NSE where Vercel's datacenter IPs get 403'd. Commits the snapshot
# so the app can read data/nse-snapshot.json. First run is a live diagnostic.

on:
  schedule:
    - cron: '20 3 * * 1-5'    # ~08:50 IST (pre-open) Mon-Fri
    - cron: '30 6 * * 1-5'    # ~12:00 IST (midday) Mon-Fri
  workflow_dispatch:           # manual trigger for the first diagnostic run

permissions:
  contents: write              # allow committing the snapshot

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git pull --rebase` in the commit step works reliably

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NSE library
        run: npm install stock-nse-india --no-save

      - name: Fetch NSE snapshot
        run: node scripts/fetch-nse-snapshot.js
        continue-on-error: true   # don't fail the whole run on a block; we want the diagnostic

      - name: Commit snapshot if changed
        run: |
          git config user.name "pranaykushnaji"
          git config user.email "pranaykushnaji284@gmail.com"
          if [ -n "$(git status --porcelain data/nse-snapshot.json)" ]; then
            git add data/nse-snapshot.json
            git commit -m "chore: update NSE snapshot [skip ci]"
            # Other writers (Stock of the Day / sell-check via the Vercel GitHub API) may
            # push to main at the same moment, which makes a plain `git push` fail with a
            # non-fast-forward rejection. Rebase onto the latest main and retry so our
            # snapshot push survives that race instead of failing the run.
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Snapshot committed (push attempt $attempt)."
                pushed=true
                break
              fi
              echo "Push rejected (main moved) — rebasing and retrying ($attempt/5)..."
              git pull --rebase --autostash origin main || true
              sleep 3
            done
            if [ "$pushed" != "true" ]; then
              echo "ERROR: push still failing after 5 attempts."
              exit 1
            fi
          else
            echo "No snapshot change to commit."
          fi
