name: Trading safety tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/upstox-market-data, codex/trading-desk-preview]
    paths-ignore: ['data/**', 'research/universe.json']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
